name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      APP_ENV: testing
      APP_DEBUG: true
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      CACHE_STORE: redis
      SESSION_DRIVER: file
      QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      BROADCAST_CONNECTION: log
      BROADCAST_DRIVER: log

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: mbstring, intl, pdo_sqlite, sqlite3, redis, fileinfo

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            cat > .env <<'EOF'
            APP_NAME=Laravel
            APP_ENV=testing
            APP_KEY=
            APP_DEBUG=true
            APP_URL=http://127.0.0.1:8000
            LOG_CHANNEL=stack
            LOG_STACK=daily
            DB_CONNECTION=sqlite
            DB_DATABASE=database/database.sqlite
            CACHE_STORE=redis
            SESSION_DRIVER=file
            QUEUE_CONNECTION=redis
            REDIS_HOST=127.0.0.1
            REDIS_PORT=6379
            BROADCAST_CONNECTION=log
            EOF
          fi
          mkdir -p database
          touch database/database.sqlite
          php artisan key:generate --ansi --force

      - name: Static analysis
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

      - name: Backend tests
        run: ./vendor/bin/phpunit

      - name: Frontend tests
        run: npx vitest run

      - name: Frontend build
        run: npm run build

      - name: Validate health routes are registered
        run: |
          php -r 'chdir(getcwd()); require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $kernel = $app->make("Illuminate\\Contracts\\Console\\Kernel"); $kernel->bootstrap(); $routes = app("router")->getRoutes(); $required=["api/health","api/health/realtime","api/health/queues"]; $found=[]; foreach($routes as $r){ $found[]=$r->uri(); } foreach($required as $uri){ if(!in_array($uri,$found,true)){ fwrite(STDERR, "Missing route: $uri\n"); exit(1);} } echo "Health routes OK\n";'

      - name: Start app and run smoke test
        run: |
          chmod +x docker/scripts/smoke-test.sh
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &
          for i in {1..20}; do
            if curl -s -o /dev/null http://127.0.0.1:8000/up; then
              break
            fi
            sleep 1
          done
          ./docker/scripts/smoke-test.sh http://127.0.0.1:8000
