name: Security Audit

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Safe placeholders so `composer install` (which triggers
      # `artisan package:discover`) does not blow up trying to
      # construct a real Reverb/Pusher broadcaster.
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BROADCAST_CONNECTION: log
      BROADCAST_DRIVER: log
      REVERB_APP_ID: local
      REVERB_APP_KEY: local
      REVERB_APP_SECRET: local
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8080
      REVERB_SCHEME: http

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JS dependencies
        run: npm ci

      - name: Composer security audit
        run: composer audit --no-interaction

      - name: NPM security audit (prod deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency governance check
        run: node scripts/quality/check-deps-health.cjs

      - name: Check for outdated packages
        run: npm outdated || true
