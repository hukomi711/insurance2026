# ── Gitleaks configuration ─────────────────────────────────────────
# Custom rules for this project in addition to gitleaks built-in rules.

title = "Insurance2026 Gitleaks Config"

[allowlist]
  # Paths that are safe to skip
  paths = [
    '''vendor/''',
    '''node_modules/''',
    '''.venv/''',
    '''public/build/''',
    '''storage/''',
  ]

# ── Custom rules ──────────────────────────────────────────────────

[[rules]]
  id = "ssh-password-inline"
  description = "Hardcoded SSH password in a programmatic SSH connection"
  regex = '''(?i)(?:ssh\.connect|paramiko[^\n]*connect)[^\n]*(?:password|passwd)\s*[=:]\s*['"][^'"]{8,}['"]'''
  keywords = ["ssh.connect", "paramiko"]

[[rules]]
  id = "server-ip-with-credentials"
  description = "Server IP combined with credentials"
  regex = '''(?i)ssh\.connect\s*\([^)]*password\s*='''
  keywords = ["ssh.connect"]

[[rules]]
  id = "laravel-env-secrets"
  description = "High-confidence Laravel secrets that should not be committed"
  regex = '''(?im)^(?:APP_KEY[ \t]*=[ \t]*base64:[A-Za-z0-9+/=]{20,}|(?:DB_PASSWORD|REDIS_PASSWORD|STATUS_POLL_SECRET|REVERB_APP_SECRET)[ \t]*=[ \t]*[A-Fa-f0-9]{24,})[ \t]*$'''
  path = '''\.env'''
  keywords = ["APP_KEY", "DB_PASSWORD", "STATUS_POLL_SECRET", "REVERB_APP_SECRET"]

[[rules]]
  id = "admin-password-inline"
  description = "Hardcoded admin password"
  regex = '''(?im)^ADMIN_PASSWORD[ \t]*=[ \t]*[^\s$]{16,}[ \t]*$'''
  keywords = ["ADMIN_PASSWORD"]

[[rules]]
  id = "gmail-app-password"
  description = "Gmail app password (16 char space-separated)"
  regex = '''(?i)MAIL_PASSWORD\s*=\s*["']?[a-z]{4}\s+[a-z]{4}\s+[a-z]{4}\s+[a-z]{4}["']?'''
  keywords = ["MAIL_PASSWORD"]
