# ═══════════════════════════════════════════════════════════════════
# Insurance 2026 — Docker Compose (Production)
# ═══════════════════════════════════════════════════════════════════
# Usage:
#   cp .env.production .env
#   docker compose up -d --build
# ═══════════════════════════════════════════════════════════════════

services:
  # ── Nginx reverse-proxy ──────────────────────────────────────
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: ins2026-nginx:brotli
    container_name: ins2026-nginx
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - app-public:/var/www/html/public:ro
      - ./docker/certbot/conf:/etc/nginx/ssl:ro
      - ./docker/certbot/www:/var/www/certbot:ro
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN env var (primary public domain)}"
      NGINX_ENVSUBST_FILTER: "^DOMAIN$"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── PHP-FPM application ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: insurance2026-app
    container_name: ins2026-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - app-storage:/var/www/html/storage
      - app-public:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Laravel Horizon (queue workers) ──────────────────────────
  horizon:
    image: insurance2026-app
    container_name: ins2026-horizon
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
      - backend
    command: php artisan horizon
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Laravel Reverb (WebSocket server) ────────────────────────
  reverb:
    image: insurance2026-app
    container_name: ins2026-reverb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
      REVERB_ALLOWED_ORIGINS: "*"
    secrets:
      - db_password
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
      - frontend
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    healthcheck:
      test: ["CMD-SHELL", 'php -r ''exit(@fsockopen("localhost",8080)?0:1);''']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Laravel Scheduler (cron replacement) ─────────────────────
  scheduler:
    image: insurance2026-app
    container_name: ins2026-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
      - backend
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 60s
      timeout: 5s
      retries: 3

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ins2026-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes --tcp-backlog 511
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ── MariaDB ──────────────────────────────────────────────────
  db:
    image: mariadb:11-jammy
    container_name: ins2026-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: insurance2026
      MARIADB_USER: insurance
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# ── Secrets ──────────────────────────────────────────────────────
secrets:
  db_password:
    file: ./docker/secrets/db_password.txt
  db_root_password:
    file: ./docker/secrets/db_root_password.txt

# ── Volumes ──────────────────────────────────────────────────────
volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
  app-storage:
    driver: local
  app-public:
    driver: local

# ── Networks ─────────────────────────────────────────────────────
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
