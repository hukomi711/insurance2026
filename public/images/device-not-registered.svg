<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Background circle -->
  <circle cx="120" cy="120" r="110" fill="#f0f0f0" />

  <!-- Device illustration -->
  <g transform="translate(120, 100)">
    <!-- Phone body -->
    <rect x="-35" y="-45" width="70" height="95" rx="8" fill="#1D252D" stroke="#4F008C" stroke-width="2" />

    <!-- Phone screen -->
    <rect x="-30" y="-40" width="60" height="80" rx="4" fill="#ffffff" />

    <!-- Prohibited symbol -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#FF375E" stroke-width="3" />
    <line x1="-14" y1="-14" x2="14" y2="14" stroke="#FF375E" stroke-width="3" stroke-linecap="round" />

    <!-- Home button -->
    <circle cx="0" cy="45" r="3" fill="#4F008C" opacity="0.3" />
  </g>

  <!-- Exclamation icon below -->
  <g transform="translate(120, 180)">
    <circle r="15" fill="#FFE8E8" />
    <circle cy="-6" r="2" fill="#FF375E" />
    <path d="M -1 2 L 1 2 L 0 8" stroke="#FF375E" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
