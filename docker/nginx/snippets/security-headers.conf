# Shared security headers — include in any location that defines its own
# add_header directives (which otherwise erase inherited headers).
add_header X-Frame-Options           "SAMEORIGIN"                                       always;
add_header X-Content-Type-Options    "nosniff"                                          always;
add_header X-XSS-Protection          "1; mode=block"                                    always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"                  always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"     always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)"     always;
add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' wss:; frame-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
