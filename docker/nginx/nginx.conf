load_module /etc/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /etc/nginx/modules/ngx_http_brotli_static_module.so;

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Hide Nginx version ───────────────────────────────────────
    server_tokens  off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time '
                      'uct=$upstream_connect_time uht=$upstream_header_time '
                      'lrs=$limit_req_status lcs=$limit_conn_status';

    access_log  /var/log/nginx/access.log  main;

    # Cloudflare real visitor IP
    # Trust CF-Connecting-IP only when the immediate peer is in Cloudflare's
    # published network ranges. Direct origin traffic therefore keeps its
    # socket peer address even if it supplies a forged CF-Connecting-IP header.
    # Source: https://www.cloudflare.com/ips/ (checked 2026-08-25)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # ── Performance ──────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 4096;
    server_names_hash_bucket_size 128;

    # ── Abuse-control observability (dry-run only) ──────────────
    # After Real IP processing, $binary_remote_addr is either the visitor IP
    # restored from a trusted Cloudflare peer or the direct socket peer IP.
    # These provisional rates only produce metrics/logs; tune them from
    # production observations before changing either dry-run directive to "off".
    limit_req_zone  $binary_remote_addr zone=website_per_ip:10m   rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=api_per_ip:10m       rate=15r/s;
    limit_req_zone  $binary_remote_addr zone=pricing_per_ip:10m   rate=2r/s;
    limit_req_zone  $binary_remote_addr zone=admin_auth_per_ip:10m rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=otp_per_ip:10m       rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

    limit_req_dry_run  on;
    limit_conn_dry_run on;
    limit_req_status   429;
    limit_conn_status  429;
    limit_req_log_level  notice;
    limit_conn_log_level notice;

    # ── Gzip compression ─────────────────────────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    4;
    gzip_min_length    1024;
    gzip_disable       "msie6";
    gzip_static        on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        application/atom+xml
        application/ld+json
        application/manifest+json
        image/svg+xml;

    # ── Brotli compression (15-20% smaller than gzip) ────────────
    brotli             on;
    brotli_comp_level  5;
    brotli_min_length  1024;
    brotli_static      on;
    brotli_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        application/atom+xml
        application/ld+json
        application/manifest+json
        application/wasm
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
