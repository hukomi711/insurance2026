# ═══════════════════════════════════════════════════════════════════
# Nginx — Insurance 2026 Production
# ═══════════════════════════════════════════════════════════════════
# HTTPS with Let's Encrypt. HTTP redirects to HTTPS.
# Proxies PHP to the app container via FastCGI, WebSocket to Reverb.
# ═══════════════════════════════════════════════════════════════════

# ── Redirect www → non-www (HTTP) ────────────────────────────────
server {
    listen 80;
    server_name www.tamzone.store;
    return 301 https://tamzone.store$request_uri;
}

# ── Redirect www → non-www (HTTPS) ───────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name www.tamzone.store;

    ssl_certificate     /etc/nginx/ssl/live/tamzone.store/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/tamzone.store/privkey.pem;

    return 301 https://tamzone.store$request_uri;
}

# ── HTTP → HTTPS redirect + ACME challenge ───────────────────────
server {
    listen 80;
    server_name tamzone.store;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health-check (Docker)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server block ──────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name tamzone.store;

    # ── SSL certificates ─────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/live/tamzone.store/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/tamzone.store/privkey.pem;

    # ── SSL hardening ────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── OCSP stapling ────────────────────────────────────────────
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver_timeout    5s;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # ── Security headers ─────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-XSS-Protection          "1; mode=block"    always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' wss: ws:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # ── Static assets — long cache ───────────────────────────────
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control           "public, immutable";
        add_header X-Content-Type-Options  "nosniff"          always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' wss: ws:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    location ~* \.(ico|css|js|gif|jpe?g|png|webp|avif|svg|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control           "public";
        add_header X-Content-Type-Options  "nosniff" always;
        try_files $uri =404;
    }

    # ── Docker DNS — resolve container hostnames dynamically ────
    # Only use Docker's internal DNS; it forwards external queries
    # to the host's resolvers automatically (for OCSP stapling etc.)
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $reverb_upstream http://reverb:8080;

    # ── WebSocket — Reverb ───────────────────────────────────────
    location /app/ {
        proxy_pass             $reverb_upstream;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }

    # ── Reverb internal apps listing (internal only) ──────────
    location /apps/ {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny  all;
        proxy_pass             $reverb_upstream;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
    }

    # ── PHP via FastCGI ──────────────────────────────────────────

    # ── Admin panel — IP restriction (before Laravel) ────────────
    # Blocks admin page + API at Nginx level, even if Laravel is bypassed.
    # IPs must match ADMIN_ALLOWED_IPS in .env.
    location /admin {
        allow 86.108.33.0/24;
        allow 91.186.249.0/24;
        allow 149.200.255.0/24;
        allow 213.139.59.0/24;
        allow 212.34.23.0/24;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny  all;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /api/admin {
        allow 86.108.33.0/24;
        allow 91.186.249.0/24;
        allow 149.200.255.0/24;
        allow 213.139.59.0/24;
        allow 212.34.23.0/24;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny  all;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass            app:9000;
        fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include                 fastcgi_params;
        fastcgi_hide_header     X-Powered-By;
        fastcgi_read_timeout    60s;
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;
    }

    # ── Well-known files (security.txt, etc.) ───────────────────
    location /.well-known/ {
        try_files $uri =404;
    }

    # ── Deny hidden files ────────────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ── Request limits ───────────────────────────────────────────
    client_max_body_size 10m;
}
