# ═══════════════════════════════════════════════════════════════════
# Nginx — Insurance 2026 Production (processed config)
# ═══════════════════════════════════════════════════════════════════
# HTTPS with Let's Encrypt. HTTP serves ACME challenge + redirects.
# Proxies PHP to the app container via FastCGI, WebSocket to Reverb.
# ═══════════════════════════════════════════════════════════════════

# ── Redirect www → non-www (HTTP) ────────────────────────────────
server {
    listen 80;
    server_name www.tamminzonlinez.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://tamminzonlinez.online$request_uri;
    }
}

# ── Redirect www → non-www (HTTPS) ───────────────────────────────
server {
    listen 443 ssl;
    # HTTP/2 is disabled for now because Chrome on the target ISP reports
    # ERR_HTTP2_PING_FAILED for successfully served dashboard assets.
    server_name www.tamminzonlinez.online;

    ssl_certificate     /etc/nginx/ssl/live/tamminzonlinez.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/tamminzonlinez.online/privkey.pem;

    return 301 https://tamminzonlinez.online$request_uri;
}

# ── HTTP → HTTPS redirect + ACME challenge ───────────────────────
server {
    listen 80 default_server;
    server_name tamminzonlinez.online _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health-check (Docker)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://tamminzonlinez.online$request_uri;
    }
}

# ── Main HTTPS server block ──────────────────────────────────────
server {
    listen 443 ssl default_server;
    # HTTP/2 is disabled for now because Chrome on the target ISP reports
    # ERR_HTTP2_PING_FAILED for successfully served dashboard assets.
    server_name tamminzonlinez.online;
    server_tokens off;

    # ── SSL certificates ─────────────────────────────────────────────
    ssl_certificate         /etc/nginx/ssl/live/tamminzonlinez.online/fullchain.pem;
    ssl_certificate_key     /etc/nginx/ssl/live/tamminzonlinez.online/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/live/tamminzonlinez.online/chain.pem;

    # ── SSL hardening ────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── OCSP stapling ────────────────────────────────────────────
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver_timeout    5s;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # ── Security headers (server-level default) ──────────────────
    # NOTE: any location that defines its own add_header MUST also
    # `include /etc/nginx/snippets/security-headers.conf;` to keep
    # these headers — nginx does not merge add_header across levels.
    include /etc/nginx/snippets/security-headers.conf;

    # ── Vite manifest — must not be browser-cached across releases ─
    location = /build/manifest.json {
        expires off;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    location = /build/.vite/manifest.json {
        expires off;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    # ── Static assets — long cache ───────────────────────────────
    location /build/ {
        expires 1y;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(ico|css|js|gif|jpe?g|png|webp|avif|svg|woff2?|ttf|eot)$ {
        expires 1y;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── Reverb WebSocket upstream ────────────────────────────────
    # For non-containerized Reverb, point to localhost:8080
    # For containerized Reverb, use: http://reverb:8080
    set $reverb_upstream http://127.0.0.1:8080;

    # ── WebSocket — Reverb ───────────────────────────────────────
    location /app/ {
        proxy_pass             $reverb_upstream;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }

    # ── Reverb internal apps listing (internal only) ──────────
    location /apps/ {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny  all;
        proxy_pass             $reverb_upstream;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
    }

    # ── Admin auth API — public entrypoints protected by Laravel throttle + 2FA ──
    # Exact locations must appear before the /api/admin/ allowlist prefix.
    location = /api/admin/login {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /api/admin/verify-code {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /api/admin/resend-code {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Legacy admin login paths (safe redirects to SPA auth routes) ──────────
    # Keep old bookmarks working without exposing /admin/* behind allowlist.
    location = /admin/login {
        return 302 /login$is_args$args;
    }
    location = /admin/verify {
        return 302 /admin-verify$is_args$args;
    }

    # ── Admin panel — IP restriction (before Laravel) ────────────
    # Split into exact + prefix so /adminanything cannot match.
    location = /admin {
        include /etc/nginx/snippets/admin-allowlist.conf;
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ^~ /admin/ {
        include /etc/nginx/snippets/admin-allowlist.conf;
        try_files $uri $uri/ /index.php?$query_string;
    }
    # Admin API is protected by Laravel Sanctum + admin middleware. Do not apply
    # the Nginx IP allowlist here, otherwise valid 2FA logins from dynamic IPs
    # receive an HTML 403 before /api/admin/me reaches Laravel.
    location = /api/admin {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ^~ /api/admin/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass            127.0.0.1:9000;
        fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param           DOCUMENT_ROOT   $realpath_root;

        # Forward auth + HTTPS/scheme metadata for Laravel
        fastcgi_param           HTTP_AUTHORIZATION      $http_authorization;
        fastcgi_param           HTTPS                   $https if_not_empty;
        fastcgi_param           HTTP_X_FORWARDED_PROTO  $scheme;
        fastcgi_param           HTTP_X_FORWARDED_HOST   $host;

        include                 fastcgi_params;
        fastcgi_hide_header     X-Powered-By;
        fastcgi_read_timeout         60s;
        fastcgi_buffering            on;
        fastcgi_buffers              32 64k;
        fastcgi_buffer_size          64k;
        fastcgi_busy_buffers_size    256k;
        fastcgi_temp_file_write_size 256k;
    }

    # ── Well-known files (security.txt, ACME, etc.) ─────────────
    # ^~ prevents the hidden-files regex below from matching first.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # ── Deny hidden files ────────────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ── Request limits ───────────────────────────────────────────
    client_max_body_size 10m;
}
