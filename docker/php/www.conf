; ═══════════════════════════════════════════════════════════════════
; PHP-FPM Pool — www — Insurance 2026 Production
; ═══════════════════════════════════════════════════════════════════

[www]
user = appuser
group = appuser

listen = 9000
listen.owner = appuser
listen.group = appuser

; ── Process manager (dynamic for 12 GB VPS) ─────────────────────
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 8
pm.max_requests = 500

; ── Status page (for health checks) ──────────────────────────────
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; ── Logging ──────────────────────────────────────────────────────
access.log = /proc/self/fd/2
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
catch_workers_output = yes

; ── Timeouts ─────────────────────────────────────────────────────
request_terminate_timeout = 120s

; ── Environment ──────────────────────────────────────────────────
clear_env = no

; ── Security ─────────────────────────────────────────────────────
security.limit_extensions = .php
